services:
  - type: web
    name: truyen-dich-viet
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APIKEY_DEEPSEEK
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: PORT
        value: "8000"
      # Render's egress IP is challenged by the sources' anti-bot layer, so it
      # cannot crawl at all. Loading runs on a home machine that writes to the
      # same Neon database; Render only serves what is already stored. Leaving
      # this at "1" would let Render grab the singleton lease whenever the home
      # machine is off and fill the queue with blocked-source errors.
      - key: RUN_EMBEDDED_WORKER
        value: "0"
      # Sources must be listed explicitly; the crawler fails closed otherwise.
      - key: CRAWLER_ALLOWED_HOSTS
        value: www.piaotia.com,piaotia.com,www.piaotian.com,piaotian.com
      # Render provides no outbound IPv6 route; pin to the IPv4 answers.
      - key: CRAWLER_PREFER_IPV6
        value: "0"
