services:
  - type: web
    name: truyen-dich-viet
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APIKEY_DEEPSEEK
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: PORT
        value: "8000"
