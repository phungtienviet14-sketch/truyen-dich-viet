name: truyen

x-app: &app
  image: ${TRUYEN_IMAGE:-truyen-dich-viet:local}
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  init: true
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  # Quoted: an unquoted YAML flow sequence splits this on the comma into two mounts.
  tmpfs: ["/tmp:size=64m,mode=1777"]
  env_file: .env
  environment:
    SKIP_DOTENV: "1"
    DATA_DIR: /app/data
    DEEPSEEK_MODEL: deepseek-v4-flash
  volumes:
    - ${TRUYEN_DATA_PATH:-./data}:/app/data
  stop_grace_period: 90s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  web:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 768m
    cpus: 0.75
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4).read()"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  worker:
    <<: *app
    command: [python, -m, app.worker]
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 1536m
    cpus: 1.0
    healthcheck:
      test: [CMD, python, -m, app.worker, --healthcheck]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
