name: Verify and build

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SKIP_DOTENV: '1'
      APIKEY_DEEPSEEK: test-only-never-real-credentials
      DEEPSEEK_MODEL: deepseek-v4-flash
      APP_ENV: test
      SESSION_COOKIE_SECURE: 'false'
      DATA_DIR: ${{ runner.temp }}/truyen-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Syntax and undefined-name checks
        run: python -m ruff check --select E9,F63,F7,F82 app scripts tests
      - name: Unit and integration tests on a fresh database
        run: python -m pytest tests --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt --disable-pip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  container-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: truyen-dich-viet:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run web and worker against an empty temporary database
        shell: bash
        run: |
          set -euo pipefail
          docker volume create truyen-ci-data
          docker network create truyen-ci
          docker run -d --name truyen-ci-web --network truyen-ci -p 127.0.0.1:8000:8000 \
            --mount source=truyen-ci-data,target=/app/data \
            -e APP_ENV=test -e SKIP_DOTENV=1 -e APIKEY_DEEPSEEK=test-only \
            truyen-dich-viet:ci
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/health/ready
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/admin)" != 200
          docker run -d --name truyen-ci-worker --network truyen-ci \
            --mount source=truyen-ci-data,target=/app/data \
            -e APP_ENV=test -e SKIP_DOTENV=1 -e APIKEY_DEEPSEEK=test-only \
            truyen-dich-viet:ci python -m app.worker
          for attempt in $(seq 1 30); do
            if docker exec truyen-ci-worker python -m app.worker --healthcheck; then break; fi
            sleep 2
          done
          docker exec truyen-ci-worker python -m app.worker --healthcheck
          docker exec truyen-ci-web python -c "import os; assert os.getuid() != 0; assert not os.path.exists('/app/.env')"
          docker restart truyen-ci-worker
          for attempt in $(seq 1 30); do
            if docker exec truyen-ci-worker python -m app.worker --healthcheck; then break; fi
            sleep 2
          done
          docker exec truyen-ci-worker python -m app.worker --healthcheck
      - name: Container diagnostics
        if: failure()
        run: |
          docker logs truyen-ci-web || true
          docker logs truyen-ci-worker || true
      - name: Remove isolated CI resources
        if: always()
        run: |
          docker rm -f truyen-ci-worker truyen-ci-web || true
          docker volume rm truyen-ci-data || true
          docker network rm truyen-ci || true

  publish:
    needs: [test, container-smoke]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_GHCR_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Set lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
