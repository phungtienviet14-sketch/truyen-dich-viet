name: Deploy approved Oracle release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character commit SHA whose verified GHCR image already exists
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: oracle-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: oracle-production
    steps:
      - name: Deploy immutable image through verified SSH host
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          REPOSITORY: ${{ github.repository }}
          SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ -n "$SSH_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          key_file="$RUNNER_TEMP/oracle-deploy-key"
          hosts_file="$RUNNER_TEMP/oracle-known-hosts"
          trap 'rm -f -- "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts_file"
          image="ghcr.io/${REPOSITORY,,}:$RELEASE_SHA"
          ssh -i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$hosts_file" "$SSH_USER@$SSH_HOST" \
            "cd /opt/truyen && bash scripts/deploy_oracle.sh '$image'"
